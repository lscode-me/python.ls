<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Your learning progress">
    <title>Progress | LSCode - Python &amp; Linux for Life Sciences</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="./static/css/tma-style.css?v=4">
    <link rel="icon" type="image/svg+xml" href="./static/favicon.svg">
    
    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Apply Telegram theme
        document.documentElement.style.setProperty('--tg-viewport-height', tg.viewportHeight + 'px');
        document.documentElement.style.setProperty('--tg-viewport-stable-height', tg.viewportStableHeight + 'px');
    </script>
</head>
<body class="tma-body">
    <header class="tma-header">
        <div class="header-content">
            <button class="back-btn" onclick="history.back()" aria-label="Back">←</button>
            <h1 class="header-title">Progress</h1>
            <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="tma-main">
        
            <section class="tma-home">
                <div class="home-hero" style="padding: 16px;">
                    <span class="hero-icon">📊</span>
                    <h1>Your Progress</h1>
                </div>
                <div class="home-progress" id="full-progress">
                    <div class="progress-summary" id="detailed-progress">
                        <p class="loading">Loading progress data...</p>
                    </div>
                </div>
                <div style="padding: 16px;">
                    <button onclick="TMAStorage.clearAll().then(() => location.reload())" 
                            class="action-btn outline" style="width: 100%;">
                        🗑️ Clear All Progress
                    </button>
                </div>
            </section>
            <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const container = document.getElementById('detailed-progress');
                try {
                    const progress = await TMAStorage.getProgress();
                    
                    if (Object.keys(progress).length === 0) {
                        container.innerHTML = `
                            <p class="empty">No progress yet.</p>
                            <p style="text-align:center; margin-top: 8px;">
                                <a href="courses/" class="action-btn primary">Start Learning →</a>
                            </p>
                        `;
                        return;
                    }
                    
                    let html = '<div class="progress-list">';
                    for (const [course, data] of Object.entries(progress)) {
                        const percent = Math.round((data.completed / data.total) * 100);
                        html += `
                            <div class="progress-item">
                                <span class="progress-course">${course}</span>
                                <div class="progress-bar-mini">
                                    <div class="progress-fill-mini" style="width: ${percent}%"></div>
                                </div>
                                <span class="progress-percent">${percent}%</span>
                            </div>
                        `;
                    }
                    html += '</div>';
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML = '<p class="error">Could not load progress</p>';
                }
            });
            </script>
            
    </main>

    <nav class="tma-nav" id="tma-nav">
        <a href="./" class="nav-item ">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </a>
        <a href="./courses/" class="nav-item ">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Courses</span>
        </a>
        <a href="./progress/" class="nav-item active">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Progress</span>
        </a>
    </nav>

    <script src="./static/js/tma-main.js?v=4"></script>
    <script src="./static/js/tma-storage.js?v=4"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script>hljs.highlightAll();</script>
</body>
</html>
